[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tidy-currency"
version = "0.1.0"
description = "Normalize messy currency amount strings into clean, comparable values."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kevina33" }]

[tool.hatch.build.targets.wheel]
packages = ["tidy_currency"]
